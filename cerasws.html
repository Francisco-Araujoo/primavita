<style>
/* Ocultar barra de rolagem (a página continua rolando normalmente) */
html, body {
  -ms-overflow-style: none;
  scrollbar-width: none;
  margin: 0;
  padding: 0;
  background: #0a0e1a;
}
html::-webkit-scrollbar,
body::-webkit-scrollbar,
*::-webkit-scrollbar {
  display: none;
  width: 0;
  height: 0;
  background: transparent;
}

/* Embed responsivo do Canva */
.canva-embed {
  position: relative;
  width: 100%;
  height: 0;
  padding-top: 100%;            /* proporção do design: 1:1. Ex.: 16:9 = 56.25% | 9:16 = 177.78% */
  overflow: hidden;
  background: #0a0e1a;
  margin: 0;
}
.canva-embed iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: calc(100% + 24px);     /* esconde a faixa branca da direita */
  height: 100%;
  border: 0;
  padding: 0;
  margin: 0;
}

/* Celular: ocupa a tela toda */
@media (max-width: 768px) {
  .canva-embed {
    width: 100vw;
    height: 100vh;              /* fallback */
    height: 100dvh;             /* altura real no celular, sem contar a barra do navegador /
    padding-top: 0;
  }
  .canva-embed iframe {
    width: calc(100% + 24px);
    height: 100%;
  }
}
</style>

<div class="canva-embed">

    allowfullscreen="allowfullscreen" allow="fullscreen">
  </iframe>
</div>
