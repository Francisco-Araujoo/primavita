<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0a0e1a;
  -ms-overflow-style: none;
  scrollbar-width: none;
}
html::-webkit-scrollbar, body::-webkit-scrollbar, *::-webkit-scrollbar {
  display: none; width: 0; height: 0; background: transparent;
}

.canva-embed {
  --zoom: 0.7;   /* 0.5 = arte inteira, com faixas | 1 = preenche a tela, com corte */
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: #0a0e1a;
}
.canva-embed iframe {
  position: absolute;
  top: 50%;
  left: 50%;
  /* Desktop: arte inteira, sem corte */
  width: min(100vw, 100dvh);
  height: min(100vw, 100dvh);
  transform: translate(-50%, -50%);
  border: 0;
  margin: 0;
  padding: 0;
}

/* Celular: zoom intermediário */
@media (max-width: 768px) {
  .canva-embed iframe {
    width: max(100vw, calc(100dvh * var(--zoom)));
    height: max(100vw, calc(100dvh  var(--zoom)));
  }
}
</style>

<div class="canva-embed">
  <iframe loading="lazy"
    src="https://www.canva.com/design/DAHZYCfypCg/pdYxNkYPhH7Vay4P7-RIgQ/view?embed"
    allowfullscreen="allowfullscreen" allow="fullscreen">
  </iframe>
</div>
