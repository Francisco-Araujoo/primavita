<style>
.cv-wrap {
  position: relative;
  width: 100%;
  height: 0;
  padding-top: 100%;
  overflow: hidden;
  border-radius: 8px;
  margin-top: 1.6em;
  margin-bottom: 0.9em;
  box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16);
  background: #0a0e1a;
  will-change: transform;
}
.cv-wrap iframe {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  border: none; padding: 0; margin: 0;
}

/* Camada clicável (só aparece fechado) */
.cv-open {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 16px;
  background: transparent;
  border: 0;
  cursor: zoom-in;
  font-family: "Rubik", sans-serif;
}
.cv-open span {
  background: rgba(10,14,26,.85);
  color: #fff;
  border: 1px solid #00e5ff;
  padding: 8px 16px;
  border-radius: 999px;
  font-size: 14px;
}

/* Botão fechar (só aparece aberto) */
.cv-close {
  display: none;
  position: absolute;
  top: 12px; right: 12px;
  z-index: 3;
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1px solid #00e5ff;
  background: rgba(10,14,26,.85);
  color: #fff;
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
}

/* Modo ampliado */
.cv-wrap.cv-full {
  position: fixed;
  inset: 0;
  z-index: 99999;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  padding-top: 0;
  margin: 0;
  border-radius: 0;
  background: #000;
}
.cv-wrap.cv-full .cv-open { display: none; }
.cv-wrap.cv-full .cv-close { display: block; }
</style>

<div class="cv-wrap" id="cvWrap">
  <iframe loading="lazy"
    src="https://www.canva.com/design/DAHZYCfypCg/pdYxNkYPhH7Vay4P7-RIgQ/view?embed"
    allowfullscreen="allowfullscreen" allow="fullscreen">
  </iframe>
  <button class="cv-open" id="cvOpen" aria-label="Ampliar"><span>Toque para ampliar</span></button>
  <button class="cv-close" id="cvClose" aria-label="Fechar">&times;</button>
</div>
<a href="https:&#x2F;&#x2F;www.canva.com&#x2F;design&#x2F;DAHZYCfypCg&#x2F;pdYxNkYPhH7Vay4P7-RIgQ&#x2F;view?utm_content=DAHZYCfypCg&amp;utm_campaign=designshare&amp;utm_medium=embeds&amp;utm_source=link" target="_blank" rel="noopener"></a>

<script>
(function () {
  var wrap = document.getElementById('cvWrap');
  var openBtn = document.getElementById('cvOpen');
  var closeBtn = document.getElementById('cvClose');

  function openFull() {
    wrap.classList.add('cv-full');
    document.documentElement.style.overflow = 'hidden';
    var req = wrap.requestFullscreen || wrap.webkitRequestFullscreen;
    if (req) { try { var p = req.call(wrap); if (p && p.catch) p.catch(function(){}); } catch (e) {} }
  }
  function closeFull() {
    wrap.classList.remove('cv-full');
    document.documentElement.style.overflow = '';
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    }
  }

  openBtn.addEventListener('click', openFull);
  closeBtn.addEventListener('click', closeFull);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeFull(); });
  document.addEventListener('fullscreenchange', function () {
    if (!document.fullscreenElement) closeFull();
  });
})();
</script>
